<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Signup</title>

    <!-- Font Icon -->
    <link rel="stylesheet" href="static/assets1/fonts/material-icon/css/material-design-iconic-font.min.css">

    <!-- Main css -->
    <link rel="stylesheet" href="static/assets1/css/style.css">
</head>
<body>

    <div class="main">

        <!-- Sign up form -->
        <section class="signup">
            <div class="container">
                <div class="signup-content">
                    <div class="signup-form">
       <p>
                    <h2 style="color: rgb(26, 24, 24);">Validation Form</h2>
                    {% if otp %}
                    <div style="background-color: #e3f2fd; border: 1px solid #90caf9; padding: 12px; border-radius: 6px; margin-bottom: 20px;">
                        {% if email_sent %}
                            <p style="color: #2e7d32; margin: 0; font-weight: bold;">OTP has been sent to {{ email }}!</p>
                        {% else %}
                            <p style="color: #c62828; margin: 0 0 5px 0; font-size: 10pt;">(Note: Gmail SMTP blocked external mail login)</p>
                        {% endif %}
                        <p style="color: #1565c0; margin: 5px 0 0 0; font-size: 13pt;">Your Demo OTP: <strong style="font-size: 18pt; color: #d32f2f; background: #fff; padding: 2px 8px; border-radius: 4px;">{{ otp }}</strong></p>
                    </div>
                    {% endif %}
                    <form action="/predict_lo" method="POST">
                      <h1 style="color: rgb(12, 12, 12);">Write the OTP here!</h1>
                      <div style="text-align: center;">
                        <input type="text" name="message" required="required" placeholder="Enter OTP" style="font-size: 14pt; width: 200px; text-align: center; background-color: #f5f5f5; border: 2px solid #2196f3; border-radius: 4px; padding: 5px; color: #333;">
                      </div>
                      <br />
                      <div class="p-t-15">
                        <button class="btn btn--radius-2 btn--blue" type="submit">Submit</button>
                      </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </section>

   
</div>

<!-- JS -->
<script src="static/assets1/vendor/jquery/jquery.min.js"></script>
<script src="static/assets1/js/main.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->
</html>
